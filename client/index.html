<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta -->
    <title>Vantish — Anonymous Professional Confessions & Workplace Truth</title>
    <meta name="description" content="Vantish is the anonymous LinkedIn — share real workplace experiences, unfiltered office truths, and professional confessions without revealing your identity. Think Glassdoor meets Reddit." />
    <meta name="keywords" content="anonymous LinkedIn, workplace confessions, office gossip, professional network anonymous, Glassdoor alternative, work life truth, career stories, company culture, anonymous professional platform" />
    <meta name="author" content="Vantish" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical -->
    <link rel="canonical" href="https://vantish.online/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vantish" />
    <meta property="og:title" content="Vantish — The Anonymous LinkedIn. Real Work. No Filter." />
    <meta property="og:description" content="Share unfiltered workplace truths anonymously. Gossip, ground realities, and professional confessions — all without revealing who you are. The anti-LinkedIn." />
    <meta property="og:url" content="https://vantish.online/" />
    <meta property="og:image" content="https://vantish.online/openGraph.jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@vantishapp" />
    <meta name="twitter:title" content="Vantish — The Anonymous LinkedIn. Real Work. No Filter." />
    <meta name="twitter:description" content="Share unfiltered workplace truths anonymously. Gossip, ground realities, and professional confessions — all without revealing who you are." />
    <meta name="twitter:image" content="https://vantish.online/openGraph.jpeg" />
    <meta name="google-site-verification" content="NpgufTBaY2ZwoxobRdbC7Hy2ia5jFX2j3ZN8Nq2nOvo" />

    <!-- JSON-LD: WebSite -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Vantish",
      "url": "https://vantish.online/",
      "description": "The anonymous LinkedIn — a professional social platform where users share workplace gossip, ground realities, and unfiltered professional experiences without revealing their identity.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://vantish.online/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Vantish",
      "url": "https://vantish.online/",
      "logo": "https://vantish.online/logo.png",
      "sameAs": [],
      "description": "Vantish is an anonymous professional social network — Glassdoor meets Reddit. Share real workplace experiences without revealing your identity."
    }
    </script>

    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Vantish?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Vantish is an anonymous professional social platform — like LinkedIn but without the curated personas. Users share real workplace experiences, company gossip, and unfiltered professional truths without revealing their identity."
          }
        },
        {
          "@type": "Question",
          "name": "Is Vantish truly anonymous?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Vantish is built around anonymity. Your identity is never exposed when you post or comment. Think of it as a safe space to share what really happens at work."
          }
        },
        {
          "@type": "Question",
          "name": "How is Vantish different from LinkedIn?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LinkedIn is about curated professional personas. Vantish is the opposite — it's where professionals share the raw, unfiltered truth about their work life, company culture, and career experiences, anonymously."
          }
        },
        {
          "@type": "Question",
          "name": "How is Vantish different from Glassdoor?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Glassdoor is focused on company reviews. Vantish is a full social platform — think Glassdoor meets Reddit — with posts, discussions, and a professional community layer built on top of anonymity."
          }
        }
      ]
    }
    </script>
  </head>

    <div id="root"></div>
